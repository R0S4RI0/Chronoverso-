<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronoverso - Reloj Interactivo</title>
    <!-- Importamos A-Frame para el modelo 3D -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
        /* =========================================
           ESTILOS GENERALES Y DEL RELOJ (style.css)
           ========================================= */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #111;
            position: relative;
            overflow: hidden;
        }

        /* Contenedor principal del reloj */
        #clock-screen {
            display: none; /* Oculto por defecto, se muestra al hacer clic en la gallina */
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100%;
            justify-content: center;
        }

        .container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Estilo del reloj analógico */
        .clock {
            position: relative;
            width: 300px;
            height: 300px;
            margin-bottom: 20px;
            border-radius: 50%;
            background-color: #222;
            box-shadow: 0 6px 10px rgba(0, 0, 0, 0.6), 0 4px 15px rgba(0, 0, 0, 0.2);
            transform: perspective(400px) rotateX(15deg); /* Efecto 3D */
            border: 6px solid #00ff00; /* Borde verde brillante */
            box-shadow: 0 0 20px 5px rgba(0, 255, 0, 0.8); /* Resplandor */
            transition: border-color 0.5s, box-shadow 0.5s;
        }

        /* Números del reloj generados por CSS/JS (posición aproximada) */
        .clock .number {
            position: absolute;
            width: 100%;
            height: 100%;
            text-align: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }
        
        /* Manecillas */
        .hour-hand, .minute-hand, .second-hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: 50% 100%;
            transform: translateX(-50%);
            box-shadow: 3px 3px 5px rgba(0, 0, 0, 0.6);
            border-radius: 5px;
        }

        .hour-hand { width: 8px; height: 80px; background-color: #555; z-index: 2; }
        .minute-hand { width: 6px; height: 110px; background-color: #777; z-index: 1; }
        .second-hand { width: 2px; height: 130px; background-color: red; z-index: 3; }

        /* Centro del reloj */
        .center-dot {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 15px;
            height: 15px;
            background-color: #fff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 4;
        }

        /* Estilo del reloj digital */
        .digital-clock {
            display: none; /* Oculto inicialmente */
            font-size: 60px;
            color: #00ff00;
            font-weight: bold;
            text-shadow: 0 0 10px #00ff00;
            background-color: #000;
            padding: 20px 40px;
            border-radius: 10px;
            border: 2px solid #00ff00;
            margin-bottom: 20px;
            font-family: monospace;
        }

        /* Botones */
        .controls {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #333;
            color: white;
            transition: background 0.3s;
        }

        button:hover { background-color: #555; }

        /* =========================================
           ESTILOS DEL ENTORNO 3D
           ========================================= */
        #scene-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            transition: opacity 1s ease;
        }

        /* Ocultar cursor por defecto para el 3D */
        a-scene { cursor: pointer; }
    </style>
</head>
<body>

    <!-- =========================================
         PANTALLA 1: MODELO 3D (A-Frame)
         ========================================= -->
    <div id="scene-container">
        <a-scene cursor="rayOrigin: mouse" background="color: #000000" embedded style="height: 100vh; width: 100vw;">
            <!-- Luces -->
            <a-light type="ambient" color="#ffffff"></a-light>
            <a-light type="directional" position="2 4 2"></a-light>
            
            <!-- Texto de carga -->
            <a-text value="Haz clic en la gallina para entrar..." position="-2 2 -3" color="#00ff00" width="4"></a-text>
            
            <!-- Modelo 3D -->
            <a-entity id="boton3d" 
                      gltf-model="https://cdn.glitch.global/83c04856-39fe-44d8-9c0a-000000000000/cronometro_de_gallina__chicken_timer.glb" 
                      position="0 1 -3" 
                      scale="1 1 1"
                      class="clickable">
            </a-entity>
            
            <!-- Cámara -->
            <a-camera position="0 1.6 0">
                <a-cursor></a-cursor>
            </a-camera>
        </a-scene>
    </div>

    <!-- =========================================
         PANTALLA 2: RELOJ INTERACTIVO
         ========================================= -->
    <div id="clock-screen" style="display: none;">
        <div class="container">
            <!-- Reloj Analógico -->
            <div class="clock" id="analog-clock">
                <!-- Los números se generarán con JS -->
                <div class="hour-hand"></div>
                <div class="minute-hand"></div>
                <div class="second-hand"></div>
                <div class="center-dot"></div>
            </div>

            <!-- Reloj Digital -->
            <div class="digital-clock" id="digital-clock">
                00:00:00
            </div>
        </div>

        <div class="controls">
            <button id="toggleClockBtn">Cambiar Reloj</button>
            <button id="toggleSoundBtn">Activar/Desactivar Sonido</button>
        </div>
    </div>

    <!-- =========================================
         LÓGICA DE JAVASCRIPT
         ========================================= -->
    <script>
        // --- 1. LÓGICA DEL MODELO 3D (A-Frame) ---
        const model = document.querySelector('#boton3d');
        let posX = 0, posY = 1; 
        let speedX = 0.02, speedY = 0.015; 
        let rotY = 0; 

        // Animación de rebote y rotación del modelo 3D
        function animateModel() {
            if (!model) return;

            // Actualizar posiciones
            posX += speedX;
            posY += speedY;
            rotY += 0.5;

            // Rebote en los bordes (simulado)
            if (posX > 1 || posX < -1) speedX *= -1;
            if (posY > 2 || posY < 0.5) speedY *= -1;

            // Aplicar transformaciones
            model.setAttribute('position', `${posX} ${posY} -3`);
            model.setAttribute('rotation', `0 ${rotY} 0`);

            requestAnimationFrame(animateModel);
        }
        
        // Iniciar animación cuando A-Frame cargue
        if (model) {
            model.addEventListener('loaded', () => {
                // Hacer visible el modelo si estaba oculto
                model.setAttribute('visible', 'true');
                animateModel();
            });

            // Evento de clic en el modelo 3D
            model.addEventListener('click', () => {
                document.getElementById('scene-container').style.display = 'none';
                document.getElementById('clock-screen').style.display = 'flex';
                // Iniciar el reloj
                updateClock();
                setInterval(updateClock, 1000);
            });
        }

        // --- 2. LÓGICA DEL RELOJ (script.js) ---
        
        // Referencias al DOM
        const hourHand = document.querySelector('.hour-hand');
        const minuteHand = document.querySelector('.minute-hand');
        const secondHand = document.querySelector('.second-hand');
        const digitalClock = document.getElementById('digital-clock');
        const analogClock = document.getElementById('analog-clock');
        
        let isDigital = false;
        let soundEnabled = false;
        let audioContext;
        let oscillator;

        // Generar números del reloj (1 al 12)
        function createClockNumbers() {
            const clock = document.getElementById('analog-clock');
            for (let i = 1; i <= 12; i++) {
                const angle = (i * 30) * (Math.PI / 180);
                const num = document.createElement('div');
                num.className = 'number';
                num.style.transform = `rotate(${i * 30}deg)`;
                num.style.height = '100%';
                
                // Crear un span interno para que el texto no se rote
                const span = document.createElement('span');
                span.innerText = i;
                span.style.display = 'inline-block';
                span.style.transform = `rotate(-${i * 30}deg) translateY(20px)`;
                span.style.height = '100%';
                
                num.appendChild(span);
                clock.appendChild(num);
            }
        }
        createClockNumbers();

        // Actualizar reloj
        function updateClock() {
            const date = new Date();
            const seconds = date.getSeconds();
            const minutes = date.getMinutes();
            const hours = date.getHours();

            // Ángulos
            const secondAngle = (seconds / 60) * 360;
            const minuteAngle = (minutes / 60) * 360 + (seconds / 60) * 6;
            const hourAngle = ((hours % 12) / 12) * 360 + (minutes / 60) * 30;

            // Aplicar rotación a las manecillas
            secondHand.style.transform = `translateX(-50%) rotate(${secondAngle}deg)`;
            minuteHand.style.transform = `translateX(-50%) rotate(${minuteAngle}deg)`;
            hourHand.style.transform = `translateX(-50%) rotate(${hourAngle}deg)`;

            // Actualizar reloj digital
            const timeString = 
                String(hours).padStart(2, '0') + ':' + 
                String(minutes).padStart(2, '0') + ':' + 
                String(seconds).padStart(2, '0');
            
            digitalClock.innerText = timeString;

            // Efecto de borde dinámico (cambio de color)
            if (analogClock.style.display !== 'none') {
                // Generar un color HSL basado en los segundos para simular cambio
                const hue = (seconds * 6) % 360; 
                analogClock.style.borderColor = `hsl(${hue}, 100%, 50%)`;
                analogClock.style.boxShadow = `0 0 20px 5px hsla(${hue}, 100%, 50%, 0.8)`;
            }
        }

        // --- 3. CONTROLES E INTERACCIÓN ---

        // Botón Cambiar Reloj
        document.getElementById('toggleClockBtn').addEventListener('click', () => {
            isDigital = !isDigital;
            if (isDigital) {
                analogClock.style.display = 'none';
                digitalClock.style.display = 'block';
            } else {
                analogClock.style.display = 'block';
                digitalClock.style.display = 'none';
            }
        });

        // Botón Sonido (Simulado con Web Audio API)
        document.getElementById('toggleSoundBtn').addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('toggleSoundBtn');
            
            if (soundEnabled) {
                btn.style.backgroundColor = '#00ff00';
                btn.style.color = '#000';
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                playTick();
            } else {
                btn.style.backgroundColor = '#333';
                btn.style.color = '#fff';
                if (oscillator) {
                    clearInterval(oscillator);
                }
            }
        });

        // Generador de sonido "Tic Tac"
        function playTick() {
            if (!soundEnabled) return;
            
            // Generar un sonido corto
            const osc = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            osc.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            osc.type = 'square';
            osc.frequency.value = 1000; // Frecuencia del tic
            
            gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.1);
            
            osc.start();
            osc.stop(audioContext.currentTime + 0.1);
            
            // Programar el siguiente tic (opcional, aquí lo hacemos manual con setInterval para simplificar)
            // En un caso real, se llamaría a sí mismo con setTimeout
        }

    </script>
</body>
</html>
