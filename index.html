<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronoverso - Reloj Interactivo</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #111;
            position: relative;
            overflow: hidden;
        }

        #clock-screen {
            display: none; 
            position: relative;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100%;
            justify-content: center;
        }

        .container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* RELOJ ANALÓGICO */
        .clock {
            position: relative;
            width: 300px;
            height: 300px;
            margin-bottom: 20px;
            border-radius: 50%;
            background-color: #222;
            transform: perspective(400px) rotateX(15deg); 
            border: 6px solid #00ff00; 
            box-shadow: 0 0 20px 5px rgba(0, 255, 0, 0.8); 
            transition: border-color 0.5s, box-shadow 0.5s;
        }

        /* CORRECCIÓN DEFINITIVA DE LOS NÚMEROS */
        .clock .number {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            color: white;
            font-size: 24px;
            font-weight: bold;
            /* No centramos el texto aquí, lo hacemos en el span interno */
        }
        
        .clock .number span {
            position: absolute;
            left: 50%;
            top: 0;
            transform: translateX(-50%); /* Centra el número horizontalmente */
        }

        /* Manecillas */
        .hour-hand, .minute-hand, .second-hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: 50% 100%;
            transform: translateX(-50%);
            box-shadow: 3px 3px 5px rgba(0, 0, 0, 0.6);
            border-radius: 5px;
        }

        .hour-hand { width: 8px; height: 80px; background-color: #aaa; z-index: 2; }
        .minute-hand { width: 6px; height: 120px; background-color: #ddd; z-index: 1; }
        .second-hand { width: 2px; height: 140px; background-color: red; z-index: 3; }

        .center-dot {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 15px;
            height: 15px;
            background-color: #fff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 4;
        }

        /* RELOJ DIGITAL */
        .digital-clock {
            display: none; 
            font-size: 60px;
            color: #00ff00;
            font-weight: bold;
            text-shadow: 0 0 10px #00ff00;
            background-color: #000;
            padding: 20px 40px;
            border-radius: 10px;
            border: 2px solid #00ff00;
            margin-bottom: 20px;
            font-family: monospace;
        }

        /* BOTONES */
        .controls {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #333;
            color: white;
            transition: background 0.3s;
        }

        button:hover { background-color: #555; }

        #scene-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            transition: opacity 1s ease;
        }

        a-scene { cursor: pointer; }
    </style>
</head>
<body>

    <!-- PANTALLA 1: MODELO 3D -->
    <div id="scene-container">
        <a-scene cursor="rayOrigin: mouse" background="color: #000000" embedded style="height: 100vh; width: 100vw;">
            <a-light type="ambient" color="#ffffff"></a-light>
            <a-light type="directional" position="2 4 2"></a-light>
            
            <a-text value="Haz clic en la gallina para entrar..." position="-2 2 -3" color="#00ff00" width="4"></a-text>
            
            <a-entity id="boton3d" 
                      gltf-model="./gallina.glb" 
                      position="0 1 -3" 
                      scale="1 1 1"
                      class="clickable">
            </a-entity>
            
            <a-camera position="0 1.6 0">
                <a-cursor></a-cursor>
            </a-camera>
        </a-scene>
    </div>

    <!-- PANTALLA 2: RELOJ INTERACTIVO -->
    <div id="clock-screen">
        <div class="container">
            <div class="clock" id="analog-clock">
                <!-- Los números se generan con JS -->
                <div class="hour-hand"></div>
                <div class="minute-hand"></div>
                <div class="second-hand"></div>
                <div class="center-dot"></div>
            </div>

            <div class="digital-clock" id="digital-clock">
                00:00:00
            </div>
        </div>

        <div class="controls">
            <button id="toggleClockBtn">Cambiar Reloj</button>
            <button id="toggleSoundBtn">Activar/Desactivar Sonido</button>
        </div>
    </div>

    <script>
        // --- 1. LÓGICA DEL MODELO 3D ---
        const model = document.querySelector('#boton3d');
        let posX = 0, posY = 1; 
        let speedX = 0.02, speedY = 0.015; 
        let rotY = 0; 

        function animateModel() {
            if (!model) return;
            posX += speedX;
            posY += speedY;
            rotY += 0.5;

            if (posX > 1 || posX < -1) speedX *= -1;
            if (posY > 2 || posY < 0.5) speedY *= -1;

            model.setAttribute('position', `${posX} ${posY} -3`);
            model.setAttribute('rotation', `0 ${rotY} 0`);
            requestAnimationFrame(animateModel);
        }
        
        if (model) {
            model.addEventListener('loaded', () => {
                model.setAttribute('visible', 'true');
                animateModel();
            });

            model.addEventListener('click', () => {
                document.getElementById('scene-container').style.display = 'none';
                document.getElementById('clock-screen').style.display = 'flex';
                updateClock();
                setInterval(updateClock, 1000);
            });
        }

        // --- 2. LÓGICA DEL RELOJ Y NÚMEROS ---
        const hourHand = document.querySelector('.hour-hand');
        const minuteHand = document.querySelector('.minute-hand');
        const secondHand = document.querySelector('.second-hand');
        const digitalClock = document.getElementById('digital-clock');
        const analogClock = document.getElementById('analog-clock');
        
        let isDigital = false;

        // NUEVA FORMA INFALIBLE DE COLOCAR LOS NÚMEROS
        function createClockNumbers() {
            const clock = document.getElementById('analog-clock');
            for (let i = 1; i <= 12; i++) {
                const numWrapper = document.createElement('div');
                numWrapper.className = 'number';
                // Rotamos el contenedor entero
                numWrapper.style.transform = `rotate(${i * 30}deg)`;
                
                const span = document.createElement('span');
                span.innerText = i;
                // Empujamos el número hacia abajo (que en el reloj es hacia el borde)
                // Usamos padding-top en lugar de translateY para que no se salga
                span.style.paddingTop = '10px'; 
                
                // Rotamos el número en sentido contrario para que se lea derecho
                span.style.transform = `rotate(-${i * 30}deg)`;
                
                numWrapper.appendChild(span);
                clock.appendChild(numWrapper);
            }
        }
        createClockNumbers();

        function updateClock() {
            const date = new Date();
            const seconds = date.getSeconds();
            const minutes = date.getMinutes();
            const hours = date.getHours();

            const secondAngle = (seconds / 60) * 360;
            const minuteAngle = (minutes / 60) * 360 + (seconds / 60) * 6;
            const hourAngle = ((hours % 12) / 12) * 360 + (minutes / 60) * 30;

            secondHand.style.transform = `translateX(-50%) rotate(${secondAngle}deg)`;
            minuteHand.style.transform = `translateX(-50%) rotate(${minuteAngle}deg)`;
            hourHand.style.transform = `translateX(-50%) rotate(${hourAngle}deg)`;

            const timeString = 
                String(hours).padStart(2, '0') + ':' + 
                String(minutes).padStart(2, '0') + ':' + 
                String(seconds).padStart(2, '0');
            
            digitalClock.innerText = timeString;

            if (analogClock.style.display !== 'none') {
                const hue = (seconds * 6) % 360; 
                analogClock.style.borderColor = `hsl(${hue}, 100%, 50%)`;
                analogClock.style.boxShadow = `0 0 20px 5px hsla(${hue}, 100%, 50%, 0.8)`;
            }
        }

        // --- 3. CONTROLES Y AUDIO ---
        document.getElementById('toggleClockBtn').addEventListener('click', () => {
            isDigital = !isDigital;
            if (isDigital) {
                analogClock.style.display = 'none';
                digitalClock.style.display = 'block';
            } else {
                analogClock.style.display = 'block';
                digitalClock.style.display = 'none';
            }
        });

        // Lógica del sonido
        const tickSound = new Audio('./ticking-clock-sound-effect-1.mp3');
        tickSound.loop = true; 
        let soundEnabled = false;

        document.getElementById('toggleSoundBtn').addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('toggleSoundBtn');
            
            if (soundEnabled) {
                btn.style.backgroundColor = '#00ff00';
                btn.style.color = '#000';
                
                // Forzamos la carga y reproducción
                tickSound.load(); 
                const playPromise = tickSound.play();
                
                if (playPromise !== undefined) {
                    playPromise.then(_ => {
                        // Audio reproduciéndose con éxito
                    }).catch(error => {
                        // Si el navegador lo bloquea, mostramos alerta en consola
                        console.error("Error al reproducir audio. Revisa que el archivo se llame exactamente igual y esté en la misma carpeta.", error);
                        alert("No se pudo reproducir el audio. Revisa que el archivo 'ticking-clock-sound-effect-1.mp3' esté subido a GitHub con ese nombre exacto.");
                        // Revertimos el botón si falla
                        soundEnabled = false;
                        btn.style.backgroundColor = '#333';
                        btn.style.color = '#fff';
                    });
                }
            } else {
                btn.style.backgroundColor = '#333';
                btn.style.color = '#fff';
                tickSound.pause();
                tickSound.currentTime = 0; 
            }
        });
    </script>
</body>
</html>
